<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e0e5ec">
<meta name="referrer" content="no-referrer">
<meta name="description" content="建模日常 · 接单排单 / 自设授权 / 配件库 / 创意灵感，日历显示用时日长与 Deadline">
<title>建模日常</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* StarHub - Neumorphism 新拟物派
   规则：统一底色 #e0e5ec｜双阴影（暗在右下 #b8bcc2 / 亮在左上 #ffffff）
   禁止：渐变、纯黑纯白背景、可见边框、直角、hover 位移、hover 放大阴影 */
:root{
  --bg:#e0e5ec;
  --dk:#b8bcc2;
  --lt:#ffffff;
  /* 文字层级（低对比、柔和） */
  --p700:#39414f;  /* 标题 */
  --p600:#525b6a;  /* 正文 */
  --p500:#6d7686;  /* 标签 */
  --p400:#8b94a2;  /* 次要 */
  --p300:#a3abb8;  /* 提示 */
  --p200:#cdd4de;  /* 分隔 */
  --p100:#d6dce5;  /* 虚线 */
  --p50:#e6eaf0;
  /* 强调色：粉（仅用于图标与激活态） */
  --ac:#d9789f;
  --ac-d:#c05c86;
  --ac-soft:rgba(217,120,159,.16);
  /* 绿色：未授权 / 未收费（浅绿） */
  --gr:#5bb98c;
  --gr-d:#2e8f63;
  --gr-soft:rgba(91,185,140,.16);
  /* 双阴影体系 */
  --sh-sm:4px 4px 8px var(--dk), -4px -4px 8px var(--lt);
  --sh-md:6px 6px 12px var(--dk), -6px -6px 12px var(--lt);
  --sh-lg:8px 8px 16px var(--dk), -8px -8px 16px var(--lt);
  --sh-hv:3px 3px 6px var(--dk), -3px -3px 6px var(--lt);
  --sh-in:inset 4px 4px 8px var(--dk), inset -4px -4px 8px var(--lt);
  --sh-in-s:inset 3px 3px 6px var(--dk), inset -3px -3px 6px var(--lt);
  --sh-in-lg:inset 6px 6px 12px var(--dk), inset -6px -6px 12px var(--lt);
  /* 底部导航实际高度（含安全区），供内容区与聊天页计算留白 */
  --tabh:calc(66px + env(safe-area-inset-bottom));
  --kb:0px; /* 软键盘占用高度，由 JS 实时写入 */
}
@media(min-width:768px){
  :root{--sh-lg:12px 12px 24px var(--dk), -12px -12px 24px var(--lt);
        --sh-md:8px 8px 16px var(--dk), -8px -8px 16px var(--lt);}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--p600); min-height:100vh; font-size:15px;
}
h1,h2,h3,h4{color:var(--p700); font-weight:600; margin:0;}
p{margin:0;}
button{font-family:inherit; border:0; cursor:pointer; background:none; color:inherit;}
/* iOS 专属：输入框 font-size 必须 >=16px。
   关键修复：touch-action 绝不能用 manipulation——那是独立模式(添加到主屏幕)下键盘不弹的真凶(coder/xum PR#372:
   touch-action:manipulation 加在 input 上会拦截 iOS 原生键盘弹起)。必须 touch-action:auto。 */
input,select,textarea{font-family:inherit; font-size:16px; color:var(--p700); -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; touch-action:auto;}
::placeholder{color:var(--p300);}
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

/* ===== 布局：iPad 侧边栏 / iPhone 底部栏 ===== */
#app{display:flex; min-height:100vh;}
#sidebar{display:none;}
#content{flex:1; padding:16px 16px calc(var(--tabh) + 20px); max-width:760px; margin:0 auto; width:100%;}
#tabbar{
  position:fixed; left:0; right:0; bottom:0;
  background:var(--bg); border-radius:22px 22px 0 0;
  box-shadow:0 -6px 16px var(--dk), 0 -1px 0 var(--lt);
  display:flex; justify-content:space-around; align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:50;
}
#tabbar .tab{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:7px 10px; border-radius:16px; color:var(--p400); font-size:10px;
  transition:all .2s; background:var(--bg);
}
#tabbar .tab .ic{stroke:var(--p400);}
#tabbar .tab.active{color:var(--ac-d); box-shadow:var(--sh-in-s);}
#tabbar .tab.active .ic{stroke:var(--ac);}
#tabbar .tab.center{
  width:48px; height:48px; border-radius:50%; padding:0;
  background:var(--bg); color:var(--ac-d); box-shadow:var(--sh-md); justify-content:center;
}
#tabbar .tab.center .ic{stroke:var(--ac);}
#tabbar .tab.center.active{box-shadow:var(--sh-in);}
#tabbar .tab svg{width:22px;height:22px;}
#tabbar .tab.center svg{width:26px;height:26px;}

@media(min-width:768px){
  :root{--tabh:0px;}
  #tabbar{display:none;}
  #sidebar{
    display:flex; flex-direction:column; gap:8px; width:212px; padding:24px 14px;
    background:var(--bg); border-radius:0 28px 28px 0; box-shadow:var(--sh-lg);
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  #content{padding:28px 32px 40px; max-width:980px;}
  #sidebar .logo{font-size:21px; font-weight:600; color:var(--p700); padding:6px 12px 20px; letter-spacing:1px;}
  #sidebar .tab{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:16px;
    color:var(--p500); font-size:15px; font-weight:500; transition:all .2s;
  }
  #sidebar .tab svg{width:20px;height:20px; stroke:var(--p400);}
  #sidebar .tab:hover{box-shadow:var(--sh-hv);}
  #sidebar .tab.active{color:var(--ac-d); box-shadow:var(--sh-in-s);}
  #sidebar .tab.active svg{stroke:var(--ac);}
}

/* ===== 新拟物基础组件（沿用原类名） ===== */
.clay-card{
  background:var(--bg); border-radius:20px; box-shadow:var(--sh-lg);
  padding:20px; margin-bottom:16px; transition:box-shadow .2s;
}
.clay-card.sm{border-radius:16px; padding:14px 16px; box-shadow:var(--sh-md);}
.clay-btn{
  background:var(--bg); border-radius:14px; color:var(--ac-d); font-weight:600; font-size:14px;
  padding:11px 22px; box-shadow:var(--sh-md); transition:box-shadow .2s, color .2s;
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.clay-btn:hover{box-shadow:var(--sh-hv);}
.clay-btn:active{box-shadow:var(--sh-in-s); color:var(--ac);}
.clay-btn .ic{stroke:var(--ac);}
.clay-btn.ghost{color:var(--p500);}
.clay-btn.ghost .ic{stroke:var(--p400);}
.clay-btn.big{padding:15px 30px; font-size:16px; border-radius:16px;}
.clay-btn.mini{padding:7px 14px; font-size:12px; box-shadow:var(--sh-sm); border-radius:12px;}
/* 排单行尾：极简圆形「完成制作」勾选按钮，避免拥挤 */
.donecheck{width:30px;height:30px;flex:0 0 auto;margin-left:8px;border:0;border-radius:50%;background:var(--bg);
  box-shadow:var(--sh-sm);color:var(--p500);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;}
.donecheck .ic{width:18px;height:18px;stroke:var(--p500);transition:stroke .18s;}
.donecheck:hover,.donecheck:active{box-shadow:var(--sh-in-s);}
.donecheck:hover .ic,.donecheck:active .ic{stroke:var(--gr-d);}
.clay-btn:disabled{opacity:.45; pointer-events:none;}
.clay-input{
  background:var(--bg); border:0; border-radius:14px; box-shadow:var(--sh-in);
  padding:12px 16px; outline:none; transition:box-shadow .2s; width:100%; color:var(--p700);
}
.clay-input:focus{box-shadow:var(--sh-in-lg);}
textarea.clay-input{resize:vertical; min-height:72px;}
select.clay-input{appearance:none;}
.clay-chip{
  display:inline-flex; align-items:center; gap:5px; padding:7px 14px; border-radius:12px;
  background:var(--bg); box-shadow:var(--sh-sm); font-size:12px; font-weight:600;
  color:var(--p500); cursor:pointer; transition:box-shadow .2s, color .2s; border:0;
}
.clay-chip:hover{box-shadow:var(--sh-hv);}
.clay-chip.on{box-shadow:var(--sh-in-s); color:var(--ac-d);}
.clay-chip:active{box-shadow:var(--sh-in-s);}
.clay-chip .ic{width:14px;height:14px;}

/* 图标：粉色单色线条 */
.ic{width:20px;height:20px;stroke:var(--ac);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;}
.ic.lg{width:26px;height:26px;}
.ic.white{stroke:var(--ac);}
.ic.deep{stroke:var(--ac-d);}

/* 页头 */
.vhead{display:flex;align-items:center;gap:10px;margin:4px 2px 18px;}
.vhead h2{font-size:22px;font-weight:600;}
.vhead .ic{width:26px;height:26px;}
.vhead .right{margin-left:auto;display:flex;gap:8px;}

/* 列表行 */
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--p100);}
.row:last-child{border-bottom:0;}
.row .grow{flex:1;min-width:0;}
.row .sub{font-size:12px;color:var(--p400);}
.done{text-decoration:line-through;opacity:.5;}

/* 进度条：凹槽轨道 + 强调色填充 */
.bar{height:12px;border-radius:99px;background:var(--bg);box-shadow:var(--sh-in-s);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .4s;}

/* 弹窗 */
/* iOS PWA(添加到主屏幕 standalone)键盘修复（核心）：
   输入框若位于 position:fixed 且不可滚动(overflow:hidden)的祖先内，iOS 找不到可把输入框滚入视口的滚动容器，
   会判定“无法聚焦”→ 直接不弹键盘、无法打字（浏览器正常、独立模式才坏，正是本 bug 的表现）。
   修复：让遮罩 #overlay 本身成为「唯一可滚动祖先」——position:fixed + overflow-y:auto，
   modal 不再独立滚动(去掉自身 overflow/max-height)，交由遮罩滚动把输入框露出，iOS 才会正常弹键盘并允许输入。
   遮罩仍不能用 backdrop-filter（会吞焦点），只用纯半透明背景。 */
#overlay{position:fixed;inset:0;background:rgba(40,46,58,.5);z-index:100;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
#overlay.show{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;}
#modal{
  background:var(--bg); width:100%; max-width:480px; margin:auto auto 0;
  border-radius:24px 24px 0 0; box-shadow:var(--sh-lg);
  padding:24px 22px calc(24px + env(safe-area-inset-bottom));
  animation:slideup .25s ease-out;
}
@media(min-width:768px){
  #overlay.show{justify-content:center;align-items:center;}
  #modal{margin:auto;border-radius:24px;}
}
@keyframes slideup{from{transform:translateY(50px);opacity:0;}to{transform:none;opacity:1;}}
#modal h3{font-size:18px;margin-bottom:14px;font-weight:600;}
.mrow{margin-bottom:12px;}
.mrow label{display:block;font-size:12px;font-weight:600;color:var(--p500);margin-bottom:6px;}

/* Toast */
#toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:var(--bg);color:var(--ac-d);font-size:13px;font-weight:600;
  padding:13px 22px;border-radius:16px;box-shadow:var(--sh-lg);z-index:200;
  transition:transform .3s;max-width:86vw;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* 聊天：占满可视高度，输入框恒定贴在导航栏正上方，不需要滚动才出现 */
/* 聊天页：整页锁滚，输入区恒贴底，消息列表内部滚动，绝不上移/盖住底栏 */
.chatwrap{
  display:flex; flex-direction:column;
  flex:1 1 auto; min-height:0;
}
@media(min-width:768px){.chatwrap{height:calc(100vh - 116px); height:calc(100dvh - 116px);}}
/* 聊天页改为普通文档流（不再锁死 overflow/固定高度）：iOS 聚焦输入框时才能滚动整页把输入框抬到键盘上方。
   若仍用 position:fixed + overflow:hidden，添加到主屏幕(standalone)模式下 iOS 无法滚动固定容器，键盘不弹。 */
body.chat-page{overflow:visible;}
body.chat-page #content{
  display:flex; flex-direction:column;
  min-height:calc(100vh - var(--tabh));
  min-height:calc(100dvh - var(--tabh));
  max-width:760px; margin:0 auto; width:100%;
  padding:14px 16px calc(12px + env(safe-area-inset-bottom));
}
@media(min-width:768px){ body.chat-page #content{ height:100vh; height:100dvh; max-width:980px; } }
body.chat-page .vhead{ flex:none; }
body.chat-page .chatwrap{ flex:1 1 auto; min-height:0; height:auto; }
body.chat-page #chatlog{ flex:1 1 auto; min-height:0; overflow-y:auto; }
body.chat-page .chatin{ flex:none; }
body.chat-page .stickertray{ flex:none; }
/* 软键盘弹起：聊天区收缩到「可视区 - 键盘」高度，输入栏恒定贴底、顶栏不随页面上跳 */
body.kb-open.chat-page #content{ height:calc(100dvh - var(--kb)); }
/* 软键盘弹起：收起底部导航，聊天区随 dvh 自动收缩，输入区恒定贴底 */
body.kb-open #tabbar{transform:translateY(110%);}
#tabbar{transition:transform .22s ease;}
/* AI 连接状态红/绿点 */
.apistat{display:inline-flex;align-items:center;gap:5px;border:none;background:var(--bg);
  color:var(--p600);font-size:11px;padding:7px 10px;border-radius:20px;cursor:pointer;
  box-shadow:var(--sh-sm);flex:none;line-height:1;font-family:inherit;}
.apistat i{width:9px;height:9px;border-radius:50%;background:#9aa0a6;transition:background .2s,box-shadow .2s;}
.apistat.gray i{background:#9aa0a6;}
.apistat.green i{background:#3ec46d;box-shadow:0 0 6px rgba(62,196,109,.65);}
.apistat.red i{background:#e5484d;box-shadow:0 0 6px rgba(229,72,77,.65);}
.apistat.test i{background:#f5a623;animation:apipulse 1s infinite;}
@keyframes apipulse{0%,100%{opacity:1}50%{opacity:.25}}
.apistat-t{white-space:nowrap;}
/* 聊天输入栏上方常驻的 AI 连接状态条，输入框聚焦/键盘弹起时始终可见 */
.chatstat{flex:none; display:flex; padding:2px 2px 0; min-height:0;}
.chatstat .apistat{font-size:11px; padding:6px 10px;}
#chatlog{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 2px;overscroll-behavior:contain;}
.msg{display:flex;margin-bottom:14px;gap:8px;align-items:flex-end;}
.msg .avat{
  width:36px;height:36px;border-radius:50%;background:var(--bg);color:var(--ac-d);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  box-shadow:var(--sh-sm);flex:none;
}
.msg .bub{max-width:76%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.msg.v .bub{background:var(--bg);color:var(--p700);box-shadow:var(--sh-sm);border-bottom-left-radius:6px;}
.msg.u{flex-direction:row-reverse;}
.msg.u .bub{background:var(--bg);color:var(--ac-d);box-shadow:var(--sh-in-s);border-bottom-right-radius:6px;}
.msg .bub img{max-width:180px;border-radius:12px;display:block;}
/* 正在输入…三点 */
.typing{display:inline-flex;gap:5px;align-items:center;height:14px;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ac);opacity:.45;animation:tdot 1.2s infinite ease-in-out;}
.typing i:nth-child(2){animation-delay:.18s;}
.typing i:nth-child(3){animation-delay:.36s;}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.35;}30%{transform:translateY(-4px);opacity:.9;}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;}}
.msg .time{font-size:10px;color:var(--p300);margin:0 6px;}
.voicebar{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;}
.voicebar .wave{display:inline-flex;gap:2px;align-items:center;}
.voicebar .wave i{width:3px;border-radius:2px;background:currentColor;height:8px;}
.voicebar .wave i:nth-child(2){height:14px;}.voicebar .wave i:nth-child(3){height:10px;}
.voicebar .wave i:nth-child(4){height:16px;}.voicebar .wave i:nth-child(5){height:7px;}
.voicebar.playing .wave i{animation:wv .6s infinite alternate ease-in-out;}
@keyframes wv{to{transform:scaleY(1.8);}}
.chatin{display:flex;gap:8px;align-items:center;padding-top:10px;flex:none;}

/* ===== 表情包 ===== */
.stickertray{display:none;flex-direction:column;max-height:240px;background:var(--bg);box-shadow:var(--sh-md);border-radius:18px;margin-top:6px;overflow:hidden;flex:none;}
.stickertray.show{display:flex;}
.sthead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:700;font-size:13px;color:var(--p600);flex:none;}
.stadd{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ac-d);cursor:pointer;box-shadow:var(--sh-sm);border-radius:10px;padding:5px 10px;}
.stadd:active{box-shadow:var(--sh-in-s);}
.stadd .ic{width:14px;height:14px;}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;padding:4px 14px 14px;overflow-y:auto;}
.stcell{position:relative;background:var(--bg);box-shadow:var(--sh-sm);border:none;border-radius:14px;padding:6px;cursor:pointer;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
.stcell:active{box-shadow:var(--sh-in-s);}
.stcell img{width:100%;height:100%;object-fit:contain;border-radius:9px;display:block;}
.stcell .stdel{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ac-d);color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);}
.stmty{grid-column:1/-1;text-align:center;color:var(--p400);font-size:12px;padding:18px 0;}
/* 聊天里的表情包气泡：无底无框 */
.msg.stkmsg .bub.stkbub{background:transparent;box-shadow:none;padding:0;border-radius:0;max-width:140px;border-bottom-left-radius:0;border-bottom-right-radius:0;}
.msg.stkmsg .bub.stkbub img{width:118px;height:auto;border-radius:15px;box-shadow:var(--sh-sm);display:block;}
.msg.stkmsg .bub img.stk{width:118px;height:auto;}
.msg.stkmsg .time{margin-top:auto;}

/* 日历 */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.calgrid .wd{text-align:center;font-size:11px;font-weight:600;color:var(--p400);padding:4px 0;}
.calcell{
  aspect-ratio:1/1.05; border-radius:14px; background:var(--bg); box-shadow:var(--sh-sm);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:5px; cursor:pointer; transition:box-shadow .15s; font-size:13px;
  font-weight:600; position:relative; color:var(--p600);
}
.calcell:hover{box-shadow:var(--sh-hv);}
.calcell:active{box-shadow:var(--sh-in-s);}
.calcell.dim{opacity:.4;box-shadow:none;color:var(--p300);}
.calcell.today{box-shadow:var(--sh-in-s);color:var(--ac-d);}
.calcell .dots{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;margin-top:2px;max-width:90%;}
.calcell .dots svg{width:11px;height:11px;stroke-width:2.2;stroke:var(--ac);}
/* 接单：截止日（红）/ 制作中（蓝） */
.calcell .dots .evdue svg{stroke:#c0392b;fill:#ffe6e6;}
.calcell .dots .evwork svg{stroke:#5b6ab0;fill:#e8ecfb;}

/* 勋章 & 贴纸 */
.stickers{display:flex;flex-wrap:wrap;gap:12px;}
.sticker{
  width:74px;padding:12px 4px;border-radius:16px;text-align:center;
  background:var(--bg);box-shadow:var(--sh-md);
}
.sticker .em{font-size:26px;}
.sticker .nm{font-size:10px;font-weight:600;color:var(--p600);margin-top:4px;}
.sticker .ct{font-size:9px;color:var(--p400);}
.sticker.locked{opacity:.4;filter:grayscale(1);box-shadow:var(--sh-in-s);}

/* 手账 */
.journal-page{
  background:var(--bg); border-radius:20px; box-shadow:var(--sh-lg);
  padding:26px 20px 24px; position:relative; overflow:hidden;
}
.journal-page::before{
  content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:110px;height:30px;background:var(--ac-soft);border-radius:8px;
}
.jline{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--p100);font-size:14px;color:var(--p600);}
.jline .je{font-size:18px;flex:none;}
.jtitle{text-align:center;font-weight:600;color:var(--p700);font-size:18px;margin-bottom:4px;letter-spacing:2px;}
.jdate{text-align:center;font-size:12px;color:var(--p400);margin-bottom:14px;}

/* 番茄钟 */
.focus-ring{
  width:230px;height:230px;border-radius:50%;margin:20px auto;position:relative;
  background:var(--bg);box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.focus-ring::after{
  content:"";position:absolute;inset:16px;border-radius:50%;box-shadow:var(--sh-in-s);
}
.focus-ring .tm{font-size:46px;font-weight:600;color:var(--p700);font-variant-numeric:tabular-nums;position:relative;z-index:1;}
.focus-ring .st{font-size:13px;color:var(--ac-d);font-weight:600;position:relative;z-index:1;}
#callOverlay{
  position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);color:var(--p600);text-align:center;padding:30px;
}
#callOverlay.show{display:flex;}
#callOverlay .cava{
  width:110px;height:110px;border-radius:50%;background:var(--bg);color:var(--ac-d);
  display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600;
  box-shadow:var(--sh-lg);animation:ringpulse 1.1s infinite ease-in-out;
}
@keyframes ringpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
#callOverlay h2{color:var(--p700);margin:22px 0 6px;font-size:24px;font-weight:600;}
#callOverlay p{color:var(--p500);font-size:14px;}
#callOverlay .btns{display:flex;gap:26px;margin-top:40px;}
#callOverlay .cbtn{
  width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:var(--bg);box-shadow:var(--sh-md);transition:box-shadow .2s;
}
#callOverlay .cbtn:active{box-shadow:var(--sh-in);}
#callOverlay .ans{color:var(--ac-d);}
#callOverlay .rej{color:var(--p400);}

/* 灵感库卡片（旧版横向，保留兼容） */
.vidcard{
  display:flex;gap:12px;align-items:center;padding:13px;border-radius:16px;
  background:var(--bg);box-shadow:var(--sh-md);margin-bottom:12px;transition:box-shadow .2s;
}
.vidcard:hover{box-shadow:var(--sh-hv);}
.vidcard .thumb{
  width:52px;height:52px;border-radius:14px;background:var(--bg);box-shadow:var(--sh-in-s);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.vidcard .t{font-weight:600;color:var(--p700);font-size:14px;}
.vidcard .s{font-size:11px;color:var(--p400);margin-top:3px;}

/* ===== 视频海报卡（真实封面预览） ===== */
.vgrid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:700px){.vgrid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1180px){.vgrid{grid-template-columns:repeat(3,1fr);}}
.vgrid.sm{gap:14px;}
@media(min-width:700px){.vgrid.sm{grid-template-columns:repeat(2,1fr);}}

.vpost{
  background:var(--bg);border-radius:20px;box-shadow:var(--sh-md);
  padding:10px;transition:box-shadow .2s;display:flex;flex-direction:column;
}
.vpost:hover{box-shadow:var(--sh-hv);}

/* 封面：凹陷相框，内嵌真实预览图 */
.vpost .cover{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;
  background:var(--p50);box-shadow:var(--sh-in-s);overflow:hidden;
  display:block;text-decoration:none;
}
.vpost .cover img{
  width:100%;height:100%;object-fit:cover;display:block;
  border-radius:14px;transition:transform .35s ease, filter .25s;
}
.vpost:hover .cover img{transform:scale(1.035);}
.vpost .cover .ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--p300);font-size:12px;letter-spacing:.1em;
}
/* 封面上的柔和暗角，保证角标可读 */
.vpost .cover::after{
  content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(to top,rgba(35,40,50,.55) 0%,rgba(35,40,50,.12) 34%,rgba(35,40,50,0) 62%);
}
.vpost .play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;background:rgba(224,229,236,.9);
  display:flex;align-items:center;justify-content:center;z-index:2;
  box-shadow:0 4px 12px rgba(35,40,50,.28);transition:transform .2s;
}
.vpost:hover .play{transform:translate(-50%,-50%) scale(1.08);}
.vpost .play .ic{width:22px;height:22px;stroke:var(--ac-d);}
.vpost .cover .ph .ic{width:18px;height:18px;stroke:var(--p400);}
.vpost .dur{
  position:absolute;right:8px;bottom:7px;z-index:2;color:#f2f5f9;font-size:11px;
  font-weight:600;padding:2px 7px;border-radius:8px;background:rgba(35,40,50,.55);
}
.vpost .plays{
  position:absolute;left:9px;bottom:7px;z-index:2;color:#f2f5f9;font-size:11px;
  font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.vpost .pf{
  position:absolute;left:8px;top:8px;z-index:2;color:#f2f5f9;font-size:10px;font-weight:600;
  padding:3px 8px;border-radius:9px;background:rgba(35,40,50,.5);letter-spacing:.02em;
}
.vpost .body{padding:11px 6px 4px;}
.vpost .vt{
  font-weight:600;color:var(--p700);font-size:14px;line-height:1.42;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.vpost .vs{font-size:11.5px;color:var(--p400);margin-top:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.vpost .vtag{
  font-size:10.5px;color:var(--ac-d);background:var(--bg);
  box-shadow:var(--sh-in-s);border-radius:8px;padding:2px 8px;font-weight:600;
}
.vpost .acts{display:flex;gap:8px;margin-top:10px;padding:0 2px 2px;}
.vpost .acts>*{flex:1;text-align:center;}
@media(prefers-reduced-motion:reduce){
  .vpost .cover img,.vpost .play{transition:none;}
  .vpost:hover .cover img{transform:none;}
}

/* 分段控制器：凹槽 + 凸起激活 */
.seg{
  display:flex;gap:6px;background:var(--bg);border-radius:16px;padding:6px;
  box-shadow:var(--sh-in-s);margin-bottom:18px;overflow-x:auto;
}
.seg button{
  flex:1;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:600;
  color:var(--p400);white-space:nowrap;transition:box-shadow .2s, color .2s;
}
.seg button.on{background:var(--bg);color:var(--ac-d);box-shadow:var(--sh-sm);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(min-width:768px){.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.seq{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ac-d);background:var(--bg);box-shadow:var(--sh-in-s);}
.due-in{font-size:12px;color:var(--p600);background:var(--bg);box-shadow:var(--sh-in-s);border:0;border-radius:10px;padding:5px 9px;font-family:inherit;}
.stat{text-align:center;padding:16px 6px;border-radius:16px;background:var(--bg);box-shadow:var(--sh-md);}
.stat .v{font-size:22px;font-weight:600;color:var(--p700);}
.stat .l{font-size:11px;color:var(--p400);font-weight:500;margin-top:3px;}

/* 模型状态徽标 */
.pill{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap;line-height:1.6;}
.pill-paid{background:var(--ac-soft);color:var(--ac-d);}
.pill-unpaid{background:var(--gr-soft);color:var(--gr-d);}
.pill-red{background:#ffe6e6;color:#c0392b;}
.pill-amber{background:#fff2d9;color:#a06a00;}
.pill-client{background:var(--ac-soft);color:var(--ac-d);}
.pill-self{background:var(--gr-soft);color:var(--gr-d);}
.pill-cat{background:#eef0ff;color:#5a4bd6;}
.pill-date{background:var(--ac-soft);color:var(--ac-d);}
/* 已收费（粉）/ 未授权（绿）卡片左侧色条 */
.pcard{position:relative;}
.pcard.paid{box-shadow:var(--sh-lg), inset 5px 0 0 var(--ac);}
.pcard.unpaid{box-shadow:var(--sh-lg), inset 5px 0 0 var(--gr);}
/* 分享平台标签 / 勾选 */
.shrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;}
.shp{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--gr-soft);color:var(--gr-d);font-weight:600;}
.shlbl{font-size:12px;color:var(--p500);font-weight:600;margin-right:2px;}
.shchk{font-size:12px;padding:6px 12px;border-radius:12px;background:var(--bg);box-shadow:var(--sh-sm);color:var(--p500);font-weight:600;cursor:pointer;transition:box-shadow .2s,color .2s;}
.shchk.on{box-shadow:var(--sh-in-s);color:var(--gr-d);}
.shchk:active{box-shadow:var(--sh-in-s);}

.empty{text-align:center;color:var(--p400);font-size:13px;padding:26px 0;}
.hint{font-size:11px;color:var(--p400);}
.sect{font-size:14px;font-weight:600;color:var(--p700);margin:20px 2px 10px;display:flex;align-items:center;gap:6px;}
.sect .ic{width:18px;height:18px;}

/* ---- 配件库 网格 ---- */
.accgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
@media(min-width:560px){.accgrid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:820px){.accgrid{grid-template-columns:repeat(4,1fr);}}
.acccard{padding:10px;}
.accthumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px;background:var(--bg);box-shadow:var(--sh-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.accthumb.ph{color:var(--p400);}
.accthumb.ph .ic{width:42px;height:42px;}
/* 创意灵感：来源链接/文字 */
.ideasrc{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ac-d);font-weight:600;text-decoration:none;}
.ideasrc .ic{width:13px;height:13px;}
.ideasrc:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <main id="content"></main>
</div>
<nav id="tabbar"></nav>

<div id="overlay" onclick="if(event.target===this)SH.closeModal()"><div id="modal"></div></div>
<div id="toast"></div>

<!-- Victor 夺命连环 call -->
<div id="callOverlay">
  <div class="cava" id="callAva">V</div>
  <h2 id="callTitle">Victor 来电…</h2>
  <p id="callMsg"></p>
  <p style="margin-top:8px;font-size:12px;opacity:.8">专注时间被你刷没了，他有话要说</p>
  <div class="btns">
    <button class="cbtn rej" onclick="rejectCall()">✕</button>
    <button class="cbtn ans" onclick="answerCall()">✆</button>
  </div>
</div>
